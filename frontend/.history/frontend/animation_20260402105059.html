        const geometry = new THREE.BufferGeometry(); const positions = new Float32Array(CONFIG.PARTICLE_COUNT * 3); const velocities = new Float32Array(CONFIG.PARTICLE_COUNT * 3); // ==================== PARTICLE RESET FUNCTION ==================== const

            camera.position.z=8 ; //====================T ARGET POSITIONS====================c onst topHole=n ew THREE.Vector3(0, 5, 0); const bottomHole=n ew THREE.Vector3(0, -5, 0); //====================M OUSE TO 3D CONVERSION====================c onst
            getMouseTarget=( )=> { const normalizedX = (mouseX / window.innerWidth) * 2 - 1; const normalizedY = -(mouseY / window.innerHeight) * 2 + 1; // Convert normalized coordinates to 3D space const vFOV = camera.fov * Math.PI / 180; const height = 2 * Math.tan(vFOV / 2)

            = () => { animationId = requestAnimationFrame(animate); // Smooth mouse position interpolation mouseX += (targetMouseX - mouseX) * CONFIG.MOUSE_SMOOTHING; mouseY += (targetMouseY - mouseY) * CONFIG.MOUSE_SMOOTHING; const posArray = geometry.attributes.position.array;
            const mouseTarget = getMouseTarget(); // Process particles for (let i = 0; i
            < CONFIG.PARTICLE_COUNT; i++) { const i3=i * 3; const dx=m ouseTarget.x - posArray[i3]; const dy=m ouseTarget.y - posArray[i3 + 1]; const dz=m ouseTarget.z - posArray[i3 + 2]; const distSq=d x * dx + dy * dy + dz * dz; const distance=M ath.sqrt(distSq);
                const force=C ONFIG.FORCE_STRENGTH / (distance + 0.5); velocities[i3] +=d x * force; velocities[i3 + 1] +=d y * force; velocities[i3 + 2] +=d z * force; posArray[i3] +=v elocities[i3]; posArray[i3 + 1] +=v elocities[i3 + 1]; posArray[i3 +
                2] +=v elocities[i3 + 2]; velocities[i3] *=C ONFIG.PARTICLE_FRICTION; velocities[i3 + 1] *=C ONFIG.PARTICLE_FRICTION; velocities[i3 + 2] *=C ONFIG.PARTICLE_FRICTION; if (distance < CONFIG.RESET_DISTANCE) { resetParticle(i); } } geometry.attributes.position.needsUpdate=t
                rue; renderer.render(scene, camera); frameCount++; }; animate(); //====================E VENT HANDLERS====================c onst handleMouseMove=( event)=> { targetMouseX = event.clientX; targetMouseY = event.clientY; }; const handleScroll = () => { const now = Date.now(); if (now - lastScrollTime > CONFIG.SCROLL_THROTTLE) { scrollProgress = window.scrollY / (document.body.scrollHeight - window.innerHeight);
                lastScrollTime = now; } }; const handleResize = () => { clearTimeout(resizeTimeout); resizeTimeout = setTimeout(() => { const width = window.innerWidth; const height = window.innerHeight; camera.aspect = width / height; camera.updateProjectionMatrix();
                renderer.setSize(width, height); }, 100); }; // ==================== EVENT LISTENERS ==================== window.addEventListener('mousemove', handleMouseMove, { passive: true }); window.addEventListener('scroll', handleScroll, { passive:
